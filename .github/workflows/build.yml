name: Build
permissions:
  contents: read
on:
  # Push TAG tidak memicu workflow ini: rilis punya workflow sendiri
  # yang juga menjalankan unit test — tes yang sama tidak perlu jalan
  # dua kali tiap rilis (issue #50).
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Push beruntun membatalkan run lama yang sudah basi (issue #75).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "Build APK + unit test"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Archive APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tasirin-tempmail-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          # Artefak debug tidak perlu disimpan 90 hari (issue #75).
          retention-days: 7
