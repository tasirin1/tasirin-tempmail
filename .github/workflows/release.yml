name: Release
permissions:
  contents: write
on:
  push:
    tags: ["v*"]
  # workflow_dispatch SENGAJA tidak ada (issue #105): dispatch manual
  # dari main yang sudah maju bisa menimpa APK rilis terbit dengan
  # build commit lain berlabel versi lama lewat jalur --clobber.
  # Menjalankan ulang rilis yang sama tetap bisa lewat "Re-run jobs"
  # pada run tag-nya — ref-nya tetap tag itu.

jobs:
  release:
    name: "Rilis APK bertanda tangan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools

      - name: Decode keystore dari secret
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/keystore.p12

      - name: Build release + unit test
        run: >
          ./gradlew assembleRelease testDebugUnitTest
          -PstoreFile=/tmp/keystore.p12
          -PstorePassword=${{ secrets.STORE_PASSWORD }}
          -PkeyAlias=tasirin-tempmail
          -PkeyPassword=${{ secrets.STORE_PASSWORD }}

      - name: Terbitkan GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APKVER="$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VER="${GITHUB_REF_NAME#v}"
            if [ "$VER" != "$APKVER" ]; then
              echo "::error::Tag v$VER tidak cocok dengan versionName $APKVER di build.gradle.kts"
              exit 1
            fi
          else
            VER="$APKVER"
          fi
          cp app/build/outputs/apk/release/app-release.apk "tasirin-tempmail-v${VER}.apk"
          # Catatan rilis diambil dari CHANGELOG bagian versi ini — tidak
          # lagi teks statis yang basi (issue #32).
          awk -v ver="$VER" '
            $0 ~ "^## \\[" ver "\\]" {p=1; next}
            /^## \[/ {if (p) exit}
            p
          ' CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "Rilis Tasirin TempMail v${VER} — lihat CHANGELOG.md di repo untuk rincian perubahan." > /tmp/release-notes.md
          fi
          # Idempoten (issue #76): jalan ulang pada tag yang rilisnya
          # sudah ada menimpa asetnya, bukan gagal di langkah terakhir
          # sesudah build penuh.
          if gh release view "v${VER}" > /dev/null 2>&1; then
            gh release upload "v${VER}" "tasirin-tempmail-v${VER}.apk" --clobber
            gh release edit "v${VER}" --notes-file /tmp/release-notes.md
          else
            gh release create "v${VER}" "tasirin-tempmail-v${VER}.apk" \
              --title "Tasirin TempMail v${VER}" \
              --notes-file /tmp/release-notes.md
          fi
